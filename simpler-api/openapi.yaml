openapi: 3.1.0
info:
  contact:
    email: philipp.schmurr@kit.edu
  description: "This is a Schema extraction API based on the OpenAPI 3.1 specification.\
    \  You can find out more about\nSwagger at [https://swagger.io](https://swagger.io). "
  license:
    name: MIT
  termsOfService: http://swagger.io/terms/
  title: Schema API - OpenAPI 3.1
  version: 0.8.0
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
servers:
- url: http://localhost:7373
tags:
- description: Everything about your existing data's schema
  externalDocs:
    description: Find out more
    url: http://swagger.io
  name: schema
- description: Access to information on the schema of individual entities
  externalDocs:
    description: Find out more about our store
    url: http://swagger.io
  name: entity
- description: Operations about keys
  name: key
- description: A file format supported by the schema API
  name: format
paths:
  /data-sources:
    get:
      description: desc
      operationId: getAllDataSourceMeta
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DataSource'
                type: array
            application/x-yaml:
              schema:
                items:
                  $ref: '#/components/schemas/DataSource'
                type: array
            application/xml:
              schema:
                items:
                  $ref: '#/components/schemas/DataSource'
                type: array
                xml:
                  name: data-sources
          description: successful operation
      summary: Get meta information about all registered data sources
      tags:
      - data-source
    post:
      description: desc
      operationId: addDataSourceMeta
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataSource'
          application/x-yaml:
            schema:
              $ref: '#/components/schemas/DataSource'
          application/xml:
            schema:
              $ref: '#/components/schemas/DataSource'
        description: specification of data source meta record
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSource'
            application/x-yaml:
              schema:
                $ref: '#/components/schemas/DataSource'
            application/xml:
              schema:
                $ref: '#/components/schemas/DataSource'
          description: successful operation
        "400":
          description: Bad request
      summary: Insert a new data source meta record
      tags:
      - data-source
  /data-sources/{dataSourceId}:
    get:
      description: desc
      operationId: getDataSourceMeta
      parameters:
      - $ref: '#/components/parameters/dataSourceId'
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/DataSource'
                type: array
            application/x-yaml:
              schema:
                items:
                  $ref: '#/components/schemas/DataSource'
                type: array
            application/xml:
              schema:
                items:
                  $ref: '#/components/schemas/DataSource'
                type: array
                xml:
                  name: data-sources
          description: successful operation
      summary: Get meta information about a specified data sources
      tags:
      - data-source
  /data-sources/{dataSourceId}/{pluginInputField}:
    get:
      description: desc
      operationId: getDataSourceContent
      parameters:
      - $ref: '#/components/parameters/dataSourceId'
      - $ref: '#/components/parameters/pluginInputField'
      responses:
        "200":
          content:
            application/octet-stream:
              schema:
                format: binary
                type: string
          description: successful operation
      summary: Get content of a specified data sources
      tags:
      - data-source
    post:
      description: desc
      operationId: uploadDataSourceContent
      parameters:
      - $ref: '#/components/parameters/dataSourceId'
      - $ref: '#/components/parameters/pluginInputField'
      responses:
        "200":
          description: successful operation
      summary: Upload the content of a specified data source
      tags:
      - data-source
  /formats:
    get:
      description: desc
      operationId: getAllFormats
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Format'
                type: array
            application/x-yaml:
              schema:
                items:
                  $ref: '#/components/schemas/Format'
                type: array
            application/xml:
              schema:
                items:
                  $ref: '#/components/schemas/Format'
                type: array
                xml:
                  name: formats
          description: successful operation
      summary: Get all supported formats of this API
      tags:
      - format
  /schemata:
    get:
      description: desc
      operationId: getAllSchemas
      parameters:
      - $ref: '#/components/parameters/preventOptimization'
      - $ref: '#/components/parameters/preventAutomaticOptimization'
      - $ref: '#/components/parameters/preventUserOptimization'
      - $ref: '#/components/parameters/generateInverseRelations'
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Schema'
                type: array
            application/xml:
              schema:
                items:
                  $ref: '#/components/schemas/Schema'
                type: array
                xml:
                  name: schemas
            application/x-yaml:
              schema:
                items:
                  $ref: '#/components/schemas/Schema'
                type: array
          description: successful operation
      summary: Get all available schemas from this API server
      tags:
      - schema
  /schemata/{schemaId}:
    get:
      description: desc
      operationId: getSchemaByID
      parameters:
      - $ref: '#/components/parameters/schemaId'
      - $ref: '#/components/parameters/preventOptimization'
      - $ref: '#/components/parameters/preventAutomaticOptimization'
      - $ref: '#/components/parameters/preventUserOptimization'
      - $ref: '#/components/parameters/generateInverseRelations'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schema'
            application/x-yaml:
              schema:
                $ref: '#/components/schemas/Schema'
            application/xml:
              schema:
                $ref: '#/components/schemas/Schema'
          description: successful operation
        "404":
          description: not found
      summary: Get schema by ID
      tags:
      - schema
  /schemata/{schemaId}/enhancement:
    get:
      description: Fetch all the enhancements of the specified schema
      operationId: getSchemaEnhancement
      parameters:
      - $ref: '#/components/parameters/schemaId'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaEnhancement'
          description: Operation successful
        "404":
          description: Schema not found
      summary: Get the current schema enhancement
      tags:
      - enhancement
    put:
      description: Overwrite the patches for the schema entirely
      operationId: setSchemaEnhancement
      parameters:
      - $ref: '#/components/parameters/schemaId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaEnhancement'
          application/x-yaml:
            schema:
              $ref: '#/components/schemas/SchemaEnhancement'
        description: The entire state of configured schema enhancements
        required: true
      responses:
        "200":
          description: Operation successful
        "400":
          description: Invalid data format
        "404":
          description: Schema not found
      summary: Save the entire operations stack for this schema
      tags:
      - enhancement
  /schemata/{schemaId}/enhancement/operations:
    post:
      description: Append a new enhancement operation
      operationId: insertEnhancementOperation
      parameters:
      - $ref: '#/components/parameters/schemaId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericEnhancementOperation'
        description: The new operation
      responses:
        "200":
          description: operation successful
        "400":
          description: bad request body
        "404":
          description: schema not found
      summary: Insert a new enhancement operation
      tags:
      - enhancement
  /schemata/{schemaId}/enhancements/handlers:
    post:
      description: Append a new enhancement handler
      operationId: insertEnhancementHandler
      parameters:
      - $ref: '#/components/parameters/schemaId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericEnhancementHandler'
        description: The new handler
      responses:
        "200":
          description: operation successful
        "400":
          description: bad request body
        "404":
          description: schema not found
      summary: Insert a new enhancement handler
      tags:
      - enhancement
  /schemata/{schemaId}/corrections/entities:
    post:
      description: Add an entirely new entity
      operationId: addNewEntityCorrection
      parameters:
      - $ref: '#/components/parameters/schemaId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Entity'
          application/x-yaml:
            schema:
              $ref: '#/components/schemas/Entity'
          application-xml:
            schema:
              $ref: '#/components/schemas/Entity'
        description: A new entity object
        required: true
      responses:
        "200":
          description: successful operation
        "400":
          content:
            text/plain:
              schema:
                title: id
                type: string
          description: bad request
        "404":
          description: schema not found
      summary: Add an entirely new entity
      tags:
      - correction
  /schemata/{schemaId}/corrections/entities/{entityId}:
    post:
      description: change entity name
      operationId: changeEntityNameCorrection
      parameters:
      - $ref: '#/components/parameters/schemaId'
      - $ref: '#/components/parameters/entityId'
      requestBody:
        content:
          text/plain:
            schema:
              title: id
              type: string
        description: new name as plain string
        required: true
      responses:
        "200":
          description: successful operation
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: bad request
        "404":
          description: schema or entity not found
      summary: change entity name
      tags:
      - correction
  /schemata/{schemaId}/corrections/entities/{entityId}/modifiers:
    put:
      description: Update entity modifiers
      operationId: updateEntityModifiersCorrection
      parameters:
      - $ref: '#/components/parameters/schemaId'
      - $ref: '#/components/parameters/entityId'
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: '#/components/schemas/EntityModifier'
              type: array
          application/x-yaml:
            schema:
              items:
                $ref: '#/components/schemas/EntityModifier'
              type: array
          application-xml:
            schema:
              items:
                $ref: '#/components/schemas/EntityModifier'
              type: array
              xml:
                name: EntityModifiers
        description: list of EntityModifier objects
        required: true
      responses:
        "200":
          description: successful operation
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: bad request
        "404":
          description: schema or entity not found
      summary: Update entity modifiers
      tags:
      - correction
  /schemata/{schemaId}/corrections/entities/{entityId}/attributes:
    post:
      description: Add an entirely new attribute
      operationId: addNewAttributeCorrection
      parameters:
      - $ref: '#/components/parameters/schemaId'
      - $ref: '#/components/parameters/entityId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Attribute'
          application/x-yaml:
            schema:
              $ref: '#/components/schemas/Attribute'
          application-xml:
            schema:
              $ref: '#/components/schemas/Attribute'
        description: A new attribute object
        required: true
      responses:
        "200":
          description: successful operation
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: bad request
        "404":
          description: schema or entity not found
      summary: Add an entirely new attribute
      tags:
      - correction
  /schemata/{schemaId}/corrections/entities/{entityId}/attributes/{attributeId}:
    post:
      description: change attribute name
      operationId: changeAttributeNameCorrection
      parameters:
      - $ref: '#/components/parameters/schemaId'
      - $ref: '#/components/parameters/entityId'
      - $ref: '#/components/parameters/attributeId'
      requestBody:
        content:
          text/plain:
            schema:
              type: string
        description: new name as plain string
        required: true
      responses:
        "200":
          description: successful operation
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: bad request
        "404":
          description: "schema, entity or attribute not found"
      summary: change attribute name
      tags:
      - correction
  /schemata/{schemaId}/corrections/entities/{entityId}/attributes/{attributeId}/modifiers:
    put:
      description: Update attribute modifiers
      operationId: updateAttributeModifiersCorrection
      parameters:
      - $ref: '#/components/parameters/schemaId'
      - $ref: '#/components/parameters/entityId'
      - $ref: '#/components/parameters/attributeId'
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: '#/components/schemas/AttributeModifier'
              type: array
          application/x-yaml:
            schema:
              items:
                $ref: '#/components/schemas/AttributeModifier'
              type: array
          application-xml:
            schema:
              items:
                $ref: '#/components/schemas/AttributeModifier'
              type: array
              xml:
                name: AttributeModifiers
        description: list of AttributeModifier objects
        required: true
      responses:
        "200":
          description: successful operation
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: bad request
        "404":
          description: "schema, entity or attribute not found"
      summary: Update attribute modifiers
      tags:
      - correction
  /schemata/{schemaId}/corrections/entities/{entityId}/relations:
    post:
      description: Add an entirely new relation
      operationId: addNewRelationCorrection
      parameters:
      - $ref: '#/components/parameters/schemaId'
      - $ref: '#/components/parameters/entityId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Relation'
          application/x-yaml:
            schema:
              $ref: '#/components/schemas/Relation'
          application-xml:
            schema:
              $ref: '#/components/schemas/Relation'
        description: A new relation object
        required: true
      responses:
        "200":
          description: successful operation
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: bad request
        "404":
          description: schema or entity not found
      summary: Add an entirely new relation
      tags:
      - correction
  /schemata/{schemaId}/corrections/entities/{entityId}/relations/{relationId}:
    post:
      description: change relation name
      operationId: changeRelationNameCorrection
      parameters:
      - $ref: '#/components/parameters/schemaId'
      - $ref: '#/components/parameters/entityId'
      - $ref: '#/components/parameters/relationId'
      requestBody:
        content:
          text/plain:
            schema:
              type: string
        description: new name as plain string
        required: true
      responses:
        "200":
          description: successful operation
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: bad request
        "404":
          description: "schema, entity or relation not found"
      summary: change relation name
      tags:
      - correction
  /schemata/{schemaId}/corrections/entities/{entityId}/relations/{relationId}/modifiers:
    put:
      description: Update relation modifiers
      operationId: updateRelationModifiersCorrection
      parameters:
      - $ref: '#/components/parameters/schemaId'
      - $ref: '#/components/parameters/entityId'
      - $ref: '#/components/parameters/relationId'
      requestBody:
        content:
          application/json:
            schema:
              items:
                $ref: '#/components/schemas/RelationModifier'
              type: array
          application/x-yaml:
            schema:
              items:
                $ref: '#/components/schemas/RelationModifier'
              type: array
          application-xml:
            schema:
              items:
                $ref: '#/components/schemas/RelationModifier'
              type: array
              xml:
                name: RelationModifiers
        description: list of RelationModifier objects
        required: true
      responses:
        "200":
          description: successful operation
        "400":
          content:
            text/plain:
              schema:
                type: string
          description: bad request
        "404":
          description: "schema, entity or relation not found"
      summary: Update relation modifiers
      tags:
      - correction
  /schemata/{schemaId}/diagram:
    get:
      description: desc
      operationId: getSchemaDiagram
      parameters:
      - $ref: '#/components/parameters/schemaId'
      - description: Toggle the rendering state of attributes
        explode: true
        in: query
        name: showAttributes
        required: false
        schema:
          default: true
          type: boolean
        style: form
      - description: Specify a list of highlighted entities
        explode: true
        in: query
        name: selectedEntities
        required: false
        schema:
          default: []
          items:
            title: id
            type: string
          type: array
        style: form
      - description: The distance to render when using highlighted entities
        explode: true
        in: query
        name: renderDistance
        required: false
        schema:
          default: 2
          type: integer
        style: form
      - $ref: '#/components/parameters/preventOptimization'
      - $ref: '#/components/parameters/preventAutomaticOptimization'
      - $ref: '#/components/parameters/preventUserOptimization'
      - $ref: '#/components/parameters/generateInverseRelations'
      responses:
        "200":
          content:
            image/svg+xml:
              schema:
                title: id
                type: string
            text/plain:
              schema:
                title: id
                type: string
          description: successful operation
        "404":
          description: schema not found
      summary: Get a diagram for the schema
      tags:
      - schema
  /schemata/{schemaId}/partitioned-entities:
    get:
      description: desc
      operationId: getPartitionedEntitiesBySchema
      parameters:
      - $ref: '#/components/parameters/schemaId'
      - $ref: '#/components/parameters/preventOptimization'
      - $ref: '#/components/parameters/preventAutomaticOptimization'
      - $ref: '#/components/parameters/preventUserOptimization'
      - $ref: '#/components/parameters/generateInverseRelations'
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Partition'
                type: array
            application/x-yaml:
              schema:
                items:
                  $ref: '#/components/schemas/Partition'
                type: array
            application/xml:
              schema:
                items:
                  $ref: '#/components/schemas/Partition'
                type: array
                xml:
                  name: Partitions
          description: successful operation
      tags:
      - partition
  /schemata/{schemaId}/classes:
    get:
      description: desc
      operationId: getClassesBySchema
      parameters:
      - $ref: '#/components/parameters/schemaId'
      - $ref: '#/components/parameters/preventStructuralEnhancement'
      - $ref: '#/components/parameters/preventEnhancement'
      - $ref: '#/components/parameters/classFilter'
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ClassDefinitionView'
                type: array
            application/xml:
              schema:
                items:
                  $ref: '#/components/schemas/ClassDefinitionView'
                type: array
                xml:
                  name: entities
            application/x-yaml:
              schema:
                items:
                  $ref: '#/components/schemas/ClassDefinitionView'
                type: array
          description: successful operation
      summary: get all classes of a schema
      tags:
      - schema
  /schemata/{schemaId}/entities:
    get:
      description: desc
      operationId: getEntitiesBySchema
      parameters:
      - $ref: '#/components/parameters/schemaId'
      - $ref: '#/components/parameters/preventOptimization'
      - $ref: '#/components/parameters/preventAutomaticOptimization'
      - $ref: '#/components/parameters/preventUserOptimization'
      - $ref: '#/components/parameters/generateInverseRelations'
      - $ref: '#/components/parameters/entityFilter'
      - $ref: '#/components/parameters/entityFilterDistance'
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Entity'
                type: array
            application/xml:
              schema:
                items:
                  $ref: '#/components/schemas/Entity'
                type: array
                xml:
                  name: entities
            application/x-yaml:
              schema:
                items:
                  $ref: '#/components/schemas/Entity'
                type: array
          description: successful operation
      summary: Get all entities of a schema
      tags:
      - entity
  /schemata/{schemaId}/entities/{entityId}:
    get:
      description: desc
      operationId: getEntityById
      parameters:
      - $ref: '#/components/parameters/schemaId'
      - $ref: '#/components/parameters/entityId'
      - $ref: '#/components/parameters/preventOptimization'
      - $ref: '#/components/parameters/preventAutomaticOptimization'
      - $ref: '#/components/parameters/preventUserOptimization'
      - $ref: '#/components/parameters/generateInverseRelations'
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Entity'
            application/xml:
              schema:
                $ref: '#/components/schemas/Entity'
            application/x-yaml:
              schema:
                $ref: '#/components/schemas/Entity'
          description: successful operation
      summary: Get a specific entity
      tags:
      - entity
  /schemata/{schemaId}/entities/{entityId}/identifiers:
    post:
      description: desc
      parameters:
      - $ref: '#/components/parameters/schemaId'
      - $ref: '#/components/parameters/entityId'
      - $ref: '#/components/parameters/preventOptimization'
      - $ref: '#/components/parameters/preventAutomaticOptimization'
      - $ref: '#/components/parameters/preventUserOptimization'
      - $ref: '#/components/parameters/generateInverseRelations'
      requestBody:
        content:
          application/json:
            schema: {}
        description: Some local unique string (as json) that shall be used to find
          a consistent GUID
        required: true
      responses:
        "200":
          content:
            text/plain:
              schema:
                title: id
                type: string
          description: successful operation
      summary: Get a unique ID - it is persisted if it did not exist yet
      tags:
      - identifier
  /schemata/{schemaId}/entities/{entityId}/raw:
    get:
      description: desc
      operationId: getEntityRawData
      parameters:
      - $ref: '#/components/parameters/schemaId'
      - $ref: '#/components/parameters/entityId'
      - $ref: '#/components/parameters/preventOptimization'
      - $ref: '#/components/parameters/preventAutomaticOptimization'
      - $ref: '#/components/parameters/preventUserOptimization'
      - $ref: '#/components/parameters/generateInverseRelations'
      responses:
        "200":
          content:
            application/json:
              schema:
                title: id
                type: string
            text/csv:
              schema:
                title: id
                type: string
            text/xml:
              schema:
                title: id
                type: string
          description: successful operation
      summary: Get a raw data set of that entity
      tags:
      - raw
  /semantics/ontology:
    get:
      description: desc
      operationId: getOntology
      responses:
        "200":
          content:
            text/html:
              schema:
                title: id
                type: string
            text/turtle:
              schema:
                title: id
                type: string
          description: successful operation
      summary: Get the ERO ontology
      tags:
      - semantics
  /semantics/ontology/{concept}:
    get:
      description: desc
      operationId: getConcept
      parameters:
      - explode: false
        in: path
        name: concept
        required: true
        schema:
          title: id
          type: string
        style: simple
      responses:
        "200":
          content:
            text/html:
              schema:
                title: id
                type: string
            text/turtle:
              schema:
                title: id
                type: string
          description: successful operation
      summary: Get the ontology or the concept docs
      tags:
      - semantics
  /semantics/jsonld-context:
    get:
      description: desc
      operationId: getJsonldContext
      responses:
        "200":
          content:
            application/json:
              schema:
                title: id
                type: string
          description: successful operation
      summary: Get the ERO ontology jsonld context
      tags:
      - semantics
  /semantics/units:
    get:
      description: Fetch all SI units
      operationId: getUnits
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Unit'
                type: array
          description: Unit list
      summary: Get all QUDT SI Units
      tags:
      - semantics
  /semantics/units/search:
    get:
      description: Fetch units based on a query string
      operationId: searchUnits
      parameters:
      - explode: true
        in: query
        name: searchString
        required: true
        schema:
          items:
            type: string
          type: array
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 10
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Unit'
