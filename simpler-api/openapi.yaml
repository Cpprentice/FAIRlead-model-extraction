              schema:
                additionalProperties:
                  title: id
                  type: string
          description: Match lookup
      summary: Match a list of units against a list of texts
      tags:
      - semantics
  /semantics/quantities/search:
    get:
      description: Fetch quantity kinds based on a query string
      operationId: searchQuantityKinds
      parameters:
      - explode: true
        in: query
        name: searchString
        required: true
        schema:
          items:
            type: string
          type: array
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 10
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/Quantity'
                type: array
          description: Top matches for search string
      summary: Search for QUDT quantity kinds that match a query
      tags:
      - semantics
