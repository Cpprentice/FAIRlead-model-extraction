      requestBody:
        description: list of EntityModifier objects
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: 'json-schema/EntityModifier.json'
          application/x-yaml:
            schema:
              type: array
              items:
                $ref: 'json-schema/EntityModifier.json'
          application-xml:
            schema:
              type: array
              items:
                $ref: 'json-schema/EntityModifier.json'
              xml:
                name: EntityModifiers
      responses:
        '200':
          description: successful operation
        '400':
          description: bad request
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: schema or entity not found


  /schemata/{schemaId}/corrections/entities/{entityId}/attributes:
    post:
