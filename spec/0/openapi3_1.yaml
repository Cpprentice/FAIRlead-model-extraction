        - $ref: '#/components/parameters/entityId'
        - $ref: '#/components/parameters/preventOptimization'
        - $ref: '#/components/parameters/preventAutomaticOptimization'
        - $ref: '#/components/parameters/preventUserOptimization'
        - $ref: '#/components/parameters/generateInverseRelations'
      requestBody:
        description: Some local unique string (as json) that shall be used to find a consistent GUID
        required: true
        content:
          application/json:
            schema:
              description: any valid json
#              anyOf:
#                - type: object
#                - type: number
#                - type: string
#                - type: boolean
#                - type: array
#              $ref: '#/components/schemas/AnyValidJSON'
      responses:
        '200':
          description: successful operation
          content:
            text/plain:
              schema:
                type: string
  /schemata/{schemaId}/entities/{entityId}/raw:
    get:
      tags:
        - raw
      summary: Get a raw data set of that entity
      description: desc
      operationId: getEntityRawData
      parameters:
        - $ref: '#/components/parameters/schemaId'
        - $ref: '#/components/parameters/entityId'
        - $ref: '#/components/parameters/preventOptimization'
        - $ref: '#/components/parameters/preventAutomaticOptimization'
        - $ref: '#/components/parameters/preventUserOptimization'
        - $ref: '#/components/parameters/generateInverseRelations'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
            text/csv:
              schema:
                type: string
            text/xml:
              schema:
                type: string
  /semantics/ontology:
    get:
      tags:
        - semantics
      summary: Get the ERO ontology
      description: desc
      operationId: getOntology
      responses:
        '200':
          description: successful operation
          content:
            text/html:
              schema:
                type: string
            text/turtle:
              schema:
                type: string
  /semantics/ontology/{concept}:
    get:
      tags:
        - semantics
      summary: Get the ontology or the concept docs
      description: desc
      operationId: getConcept
      parameters:
        - name: concept
          in: path
          schema:
            type: string
          required: true
      responses:
        '200':
          description: successful operation
          content:
            text/html:
              schema:
                type: string
            text/turtle:
              schema:
                type: string
  /semantics/jsonld-context:
    get:
      tags:
        - semantics
      summary: Get the ERO ontology jsonld context
      description: desc
      operationId: getJsonldContext
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: string
  /semantics/units:
    get:
      tags:
        - semantics
      summary: Get all QUDT SI Units
      description: Fetch all SI units
      operationId: getUnits
      responses:
        '200':
          description: Unit list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Unit'
  /semantics/units/search:
    get:
      tags:
        - semantics
      summary: Search for QUDT units that match a query
      description: Fetch units based on a query string
      operationId: searchUnits
      parameters:
        - name: searchString
          in: query
          schema:
            type: array
            items:
              type: string
          required: true
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
          required: false
      responses:
        '200':
          description: Top matches for search string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Unit'
  /semantics/units/match:
    get:
      tags:
        - semantics
      summary: Match a list of units against a list of texts
      description: Find the best unit of a given set to a set of texts
      operationId: matchUnits
      parameters:
        - name: unitIris
          in: query
          schema:
            type: array
            items:
              type: string
          required: true
        - name: unitTexts
          in: query
          schema:
            type: array
            items:
              type: string
          required: true
      responses:
        '200':
          description: Match lookup
          content:
            application/json:
              schema:
                # sadly a dict to units does not work correctly but strings work as well
                type: object
                additionalProperties:
                  type: string
#                type: object
#                additionalProperties:
#                  type:
#                    - object
#                    - 'null'
#                  $ref: '#/components/schemas/Unit'
  /semantics/quantities/search:
    get:
      tags:
        - semantics
      summary: Search for QUDT quantity kinds that match a query
      description: Fetch quantity kinds based on a query string
      operationId: searchQuantityKinds
      parameters:
        - name: searchString
          in: query
          schema:
            type: array
            items:
              type: string
          required: true
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
          required: false
      responses:
        '200':
          description: Top matches for search string
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Quantity'

components:
  parameters:
    dataSourceId:
      name: dataSourceId
      in: path
      schema:
        type: string
      required: true
    pluginInputField:
      name: pluginInputField
      in: path
      schema:
        type: string
      required: true
    EntityPrefix:
      name: EntityPrefix
      in: query
      schema:
        type: string
        default: ''
      required: false
    preventStructuralEnhancement:
      name: preventStructuralEnhancement
      in: query
      schema:
        type: boolean
        default: false
      required: false
    preventEnhancement:
      name: preventEnhancement
      in: query
      schema:
        type: boolean
        default: false
      required: false
    preventOptimization:
      name: preventOptimization
      in: query
      schema:
        type: boolean
        default: false
      required: false
    preventAutomaticOptimization:
      name: preventAutomaticOptimization
      in: query
      schema:
        type: boolean
        default: false
      required: false
    preventUserOptimization:
      name: preventUserOptimization
      in: query
      schema:
        type: boolean
        default: false
      required: false
    generateInverseRelations:
      name: generateInverseRelations
      in: query
      description: Toggles whether to generate inverse relations for each existing relation that has no schema based inverse
      schema:
        type: boolean
        default: false
      required: false
    entityFilter:
      name: entityFilter
      in: query
      description: Only list entities of the schema that are in range of the specified entities
      schema:
        type: array
        items:
          type: string
        default: []
      required: false
    entityFilterDistance:
      name: entityFilterDistance
      in: query
      description: Specifies the search distance if entityFilter is used
      schema:
        type: integer
        default: 1
      required: false
    classFilter:
      name: classFilter
      in: query
      description: Only include classes of the schema that are in range of the specified classes
      schema:
        type: array
        items:
          type: string
        default: []
      required: false
    entityId:
      name: entityId
      in: path
      description: ID of entity to access
      required: true
      schema:
        type: string
    schemaId:
      name: schemaId
      in: path
      description: ID of schema to access
      required: true
      schema:
        type: string
    classId:
      name: classId
      in: path
      description: ID of a class to access
      required: true
      schema:
        type: string
    attributeId:
      name: attributeId
      in: path
      description: ID of attribute to access
      required: true
      schema:
        type: string
    relationId:
      name: relationId
      in: path
      description: ID of relation to access
      required: true
      schema:
        type: string
  schemas:
#    AnyValidJSON:
#      anyOf:
#        - type: string
#        - type: number
#        - type: boolean
#        - type: object
#        - type: array
    # Attribute:
    #   $ref: 'json-schema/Attribute.json'
    #   xml:
    #     name: attribute
    # AttributeModifier:
    #   $ref: 'json-schema/AttributeModifier.json'
    #   xml:
    #     name: attribute-modifier
    # Cardinality:
    #   $ref: 'json-schema/Cardinality.json'
    #   xml:
    #     name: cardinality
    # Entity:
    #   $ref: 'json-schema/Entity.json'
    #   xml:
    #     name: entity
    # EntityModifier:
    #   $ref: 'json-schema/EntityModifier.json'
    #   xml:
    #     name: entity-modifier
    # Modifier:
    #   $ref: 'json-schema/Modifier.json'
    #   xml:
    #     name: modifier
    # Relation:
    #   $ref: 'json-schema/Relation.json'
    #   xml:
    #     name: relation
    # RelationModifier:
    #   $ref: 'json-schema/RelationModifier.json'
    #   xml:
    #     name: relation-modifier

    Annotatable:
      type: object
      properties:
        annotations:
          type: array
          items:
            $ref: '#/components/schemas/OntologicalAnnotation'

    ClassDefinitionView:
      type: object
      required:
        - name
        - attributes
        - relations
      properties:
        name:
          type: string
        attributes:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SlotDefinitionView'
          propertyNames:
            type: string

        relations:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/SlotDefinitionView'
          propertyNames:
            type: string

        annotations:
          type: array
          items:
            $ref: '#/components/schemas/OntologicalAnnotation'

    SlotDefinitionView:
      allOf:
        - $ref: '#/components/schemas/Annotatable'
        - type: object
          required:
            - name
            - range
            - key
          properties:
            name:
              type: string
            range:
              # Technically nullable: true is the official openapi way as type is only a single value officially
              #  however, using string and null as a list works for both the typescript and python code generator
              type:
                - string
                - null
              # type: string
              nullable: true
            key:
              type: boolean
            unit:
              $ref: '#/components/schemas/Unit'
    Unit:
      type: object
      required:
        - id
      properties:
        id:
          type: string
        symbol:
          type: string
        description:
          type: string

    Quantity:
      type: object
      required:
        - id
      properties:
        id:
          type: string
        symbol:
          type: string
        description:
          type: string

    OntologicalAnnotation:
      type: object
      properties:
        operator:
          type: string
          enum:
            - exact_mapping
            - close_mapping
            - narrow_mapping
            - broad_mapping
            - related_mapping
        iri:
          type: string
          format: url
        label:
          type: string
          default: ''
      required:
        - operator
        - iri

    DataSource:
      type: object
      properties:
        id:
          type: string
        description:
          type: string
        plugin:
          type: string
        populated_input_fields:  # TODO can we enforce this as read-only
          type: array
          items:
            type: string
        text_data:
          type: array
          items:
            type: object
            properties:
              input_field:
                type: string
              value:
                type: string
            required:
              - input_field
              - value
      required:
        - id
        - plugin

    EntityLink:
      type: string
      format: url
      examples:
        - http://localhost/entityXY
    Format:
      type: object
      properties:
        name:
          type: string
          examples:
            - XML
        inputs:
          type: array
          items:
            type: string
    Partition:
      type: object
      properties:
        title:
          type: string
          examples:
            - Partition 1
        entities:
          type: array
          items:
            $ref: 'json-schema/Entity.json'
    Schema:
      type: object
      properties:
        id:
          type: string
          examples:
            - case300
        description:
          type: string
          examples:
            - File based datasource from XY
        implementation:
          type: string
        schemaFile:
          type: string
        sourceFile:
          type: string
        entities:
          type: array
          xml:
            name: entities
          items:
            $ref: '#/components/schemas/EntityLink'
      xml:
        name: schema

    GenericEnhancementOperation:
      type: object
      properties:
        operation_type:
          type: string
        attributes:
          type: object
          # if nested objects and arrays are to be allowed use
          additionalProperties: true
#          additionalProperties:
#            oneOf:
#              - type: string
#              - type: number
#              - type: boolean

    GenericEnhancementHandler:
      type: object
      properties:
        producer_type:
          type: string
        triggers:
          type: array
          items:
            type: string
        attributes:
          type: object
          additionalProperties: true
#          additionalProperties:
#            oneOf:
#              - type: string
#              - type: number
#              - type: boolean

    RenameAttributeOperation:
      type: object
      properties:
        class_name:
          type: string
        old_name:
          type: string
        new_name:
          type: string
      required:
        - class_name
        - old_name
        - new_name

    ConvertAttributeToRelationOperation:
      type: object
      properties:
        class_name:
          type: string
        attribute_name:
          type: string
        new_range:
          type: string
      required:
        - class_name
        - attribute_name
        - new_range

    AssignOntologyTermOperation:
      type: object
      properties:
        item_type:
          type: string  # TODO use an enum instead
        item_id:
          type: string
        ontology_term:
          type: string
          format: uri
      required:
        - item_type
        - item_id
        - ontology_term
    EnhancementOperation:
      oneOf:
        - $ref: '#/components/schemas/RenameAttributeOperation'
        - $ref: '#/components/schemas/ConvertAttributeToRelationOperation'
        - $ref: '#/components/schemas/AssignOntologyTermOperation'


    SchemaEnhancement:
      type: object
      properties:
        operations:
          type: array
          items:
            $ref: '#/components/schemas/GenericEnhancementOperation'
        producers:
          type: array
          items:
            $ref: '#/components/schemas/GenericEnhancementHandler'
      required:
        - operations
        - producers

    PatternBasedAttributeConverter:
      type: object
      properties:
        regular_expression:
          type: string
        group_index:
          type: integer
          default: 0
        triggers:
          type: array
          items:
            type: string
      required:
        - regular_expression
        - triggers

    EnhancementHandler:
      oneOf:
        - $ref: '#/components/schemas/PatternBasedAttributeConverter'


