openapi: 3.1.0
info:
  title: Schema API - OpenAPI 3.1
  description: |-
    This is a Schema extraction API based on the OpenAPI 3.1 specification.  You can find out more about
    Swagger at [https://swagger.io](https://swagger.io). 
  termsOfService: http://swagger.io/terms/
  contact:
    email: philipp.schmurr@kit.edu
  license:
    name: MIT
    identifier: MIT
  version: 0.8.0
externalDocs:
  description: Find out more about Swagger
  url: http://swagger.io
servers:
  - url: http://localhost:7373
tags:
  - name: schema
    description: Everything about your existing data's schema
    externalDocs:
      description: Find out more
      url: http://swagger.io
  - name: entity
    description: Access to information on the schema of individual entities
    externalDocs:
      description: Find out more about our store
      url: http://swagger.io
  - name: key
    description: Operations about keys
  - name: format
    description: A file format supported by the schema API
paths:
  /data-sources:
    get:
      tags:
        - data-source
      summary: Get meta information about all registered data sources
      description: desc
      operationId: getAllDataSourceMeta
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataSource'
            application/x-yaml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataSource'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataSource'
                xml:
                  name: data-sources
    post:
      tags:
        - data-source
      summary: Insert a new data source meta record
      description: desc
      operationId: addDataSourceMeta
      requestBody:
        description: specification of data source meta record
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataSource'
          application/x-yaml:
            schema:
              $ref: '#/components/schemas/DataSource'
          application/xml:
            schema:
              $ref: '#/components/schemas/DataSource'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSource'
            application/x-yaml:
              schema:
                $ref: '#/components/schemas/DataSource'
            application/xml:
              schema:
                $ref: '#/components/schemas/DataSource'
        '400':
          description: Bad request
  /data-sources/{dataSourceId}:
    get:
      tags:
        - data-source
      summary: Get meta information about a specified data sources
      description: desc
      operationId: getDataSourceMeta
      parameters:
        - $ref: '#/components/parameters/dataSourceId'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataSource'
            application/x-yaml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataSource'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DataSource'
                xml:
                  name: data-sources
  /data-sources/{dataSourceId}/{pluginInputField}:
    get:
      tags:
        - data-source
      summary: Get content of a specified data sources
      description: desc
      operationId: getDataSourceContent
      parameters:
        - $ref: '#/components/parameters/dataSourceId'
        - $ref: '#/components/parameters/pluginInputField'
      responses:
        '200':
          description: successful operation
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
    post:
      tags:
        - data-source
      summary: Upload the content of a specified data source
      description: desc
      operationId: uploadDataSourceContent
      parameters:
        - $ref: '#/components/parameters/dataSourceId'
        - $ref: '#/components/parameters/pluginInputField'
      # requestBody:
        # description: blob of specified field
        # required: true
        # content:
          # application/octet-stream:
            # schema:
            #   type: string
            #   format: binary
      responses:
        '200':
            description: successful operation
  /formats:
    get:
      tags:
        - format
      summary: Get all supported formats of this API
      description: desc
      operationId: getAllFormats
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
