  /schemata:
    get:
      tags:
        - schema
      summary: Get all available schemas from this API server
      description: desc
      operationId: getAllSchemas
      parameters:
        - $ref: '#/components/parameters/preventOptimization'
        - $ref: '#/components/parameters/preventAutomaticOptimization'
        - $ref: '#/components/parameters/preventUserOptimization'
        - $ref: '#/components/parameters/generateInverseRelations'
        # - $ref: '#/components/parameters/EntityPrefix'
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Schema'
            application/xml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Schema'
                xml:
                  name: schemas
            application/x-yaml:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Schema'
  /schemata/{schemaId}:
    get:
      tags:
        - schema
      summary: Get schema by ID
      description: desc
      operationId: getSchemaByID
      parameters:
        - $ref: '#/components/parameters/schemaId'
        - $ref: '#/components/parameters/preventOptimization'
        - $ref: '#/components/parameters/preventAutomaticOptimization'
        - $ref: '#/components/parameters/preventUserOptimization'
        - $ref: '#/components/parameters/generateInverseRelations'
      #   - $ref: '#/components/parameters/EntityPrefix'
      responses:
        '200':
          description: 'successful operation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schema'
            application/x-yaml:
              schema:
                $ref: '#/components/schemas/Schema'
            application/xml:
              schema:
                $ref: '#/components/schemas/Schema'
        '404':
          description: 'not found'


  # The new corrections are rather called schema enhancement
  # For now we just use a single endpoint to put the patches for an entire schema - though
  #  this can be considered a raw endpoint
  /schemata/{schemaId}/enhancement:
    put:
      summary: "Save the entire operations stack for this schema"
      tags:
        - enhancement
      description: Overwrite the patches for the schema entirely
      operationId: setSchemaEnhancement
      parameters:
        - $ref: '#/components/parameters/schemaId'
      requestBody:
        description: The entire state of configured schema enhancements
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SchemaEnhancement'
          application/x-yaml:
            schema:
              $ref: '#/components/schemas/SchemaEnhancement'
      responses:
        '200': # TODO a 200 might send back the current state?
          description: 'Operation successful'
        '404':
          description: 'Schema not found'
        '400':
          description: 'Invalid data format'
    get:
      summary: "Get the current schema enhancement"
      tags:
        - enhancement
      description: Fetch all the enhancements of the specified schema
      operationId: getSchemaEnhancement
      parameters:
        - $ref: '#/components/parameters/schemaId'
      responses:
        '200':
          description: 'Operation successful'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchemaEnhancement'
        '404':
          description: 'Schema not found'
  /schemata/{schemaId}/enhancement/operations:
    post:
      summary: "Insert a new enhancement operation"
      tags:
        - enhancement
      operationId: insertEnhancementOperation
      description: Append a new enhancement operation
      parameters:
        - $ref: '#/components/parameters/schemaId'
      requestBody:
        description: The new operation
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericEnhancementOperation'
      responses:
        '200':
          description: operation successful
        '404':
          description: schema not found
        '400':
          description: bad request body

  /schemata/{schemaId}/enhancements/handlers:
    post:
      summary: "Insert a new enhancement handler"
      tags:
        - enhancement
      operationId: insertEnhancementHandler
      description: Append a new enhancement handler
      parameters:
        - $ref: '#/components/parameters/schemaId'
      requestBody:
        description: The new handler
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenericEnhancementHandler'
      responses:
        '200':
          description: operation successful
        '404':
          description: schema not found
        '400':
          description: bad request body

  # thoughts on the new corrections api
  # /schemata/{schemaId}/corrections -> get or post yaml|json|xml of partial
  # /schemata/{schemaId}/corrections/(entities/)?{entityId}/attributes/{attributeId} DELETE OR PUT for removal or update (of just the name?)
  # DELETE is overkill -> setting name to empty is enough
  #
  # operations we need:
  # - rename or delete attribute (needs current entity name, active attribute name, new attribute name) POST /schemata/{schemaId}/corrections/entities/{entityId}/attributes/{attributeName} BODY new name
  # - add or remove attribute key flag (needs current entity name, active attribute name, flag name and value) PUT /schemata/{schemaId}/corrections/entities/{entityId}/attributes/{attributeName}/modifiers BODY {key:value}pairs
  # - add a new attribute (though not sure how this can be filled with data (constant or something) (needs target entity name, full Attribute object) POST /schemata/{schemaId}/corrections/entities/{entityId}/attributes  BODY attribute object
  # - rename or delete entity (needs current entity name, new entity name) POST /schemata/{schemaId}/corrections/entities/{entityId} BODY new name
  # - add or remove entity weakness flag (needs active entity name, flag name and value) PUT /schemata/{schemaId}/corrections/entities/{entityId}/modifiers BODY key value pairs
  # - add a new entity (needs the full entity object) POST /schemata/{schemaId}/corrections/entities BODY entity object
  # - rename or delete a relation (needs the subject entity name, the current relation name, the new relation name) POST /schemata/{schemaId}/corrections/entities/{entityId}/relations/{relationName} BODY new name
  # - add or remove relation flag (needs the subject entity name, the relation name, the flag name and value) PUT /schemata/{schemaId}/corrections/entities/{entityId}/relations/{relationName}/modifiers BODY {key:value}pairs
  # - add a new relation (needs the subject entity name, the new relation object)  POST /schemata/{schemaId}/corrections/entities/{entityId}/relations BODY relation object
  /schemata/{schemaId}/corrections/entities:
    post:
      tags:
        - correction
      summary: Add an entirely new entity
      description: Add an entirely new entity
      operationId: addNewEntityCorrection
      parameters:
        - $ref: '#/components/parameters/schemaId'
      requestBody:
        description: A new entity object
        required: true
        content:
          application/json:
            schema:
              $ref: 'json-schema/Entity.json'
          application/x-yaml:
            schema:
              $ref: 'json-schema/Entity.json'
          application-xml:
            schema:
              $ref: 'json-schema/Entity.json'
      responses:
        '200':
          description: successful operation
        '400':
          description: bad request
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: schema not found
  /schemata/{schemaId}/corrections/entities/{entityId}:
    post:
      tags:
        - correction
      summary: change entity name
      description: change entity name
      operationId: changeEntityNameCorrection
      parameters:
        - $ref: '#/components/parameters/schemaId'
        - $ref: '#/components/parameters/entityId'
      requestBody:
        description: new name as plain string
        required: true
        content:
          text/plain:
            schema:
              type: string
      responses:
        '200':
          description: successful operation
        '400':
          description: bad request
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: schema or entity not found
  /schemata/{schemaId}/corrections/entities/{entityId}/modifiers:
    put:
      tags:
        - correction
      summary: Update entity modifiers
      description: Update entity modifiers
      operationId: updateEntityModifiersCorrection
      parameters:
        - $ref: '#/components/parameters/schemaId'
